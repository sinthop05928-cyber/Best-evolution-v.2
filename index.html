/* =========================
   HUD
========================= */

    font-weight:bold;

   MENU
========================= */

#menu{

    display:flex;
    align-items:center;

}

/* =========================

========================= */

#joy{

    height:132px;

}

#stick{
    position:absolute;

    left:38px;
    top:38px;

    width:54px;
    height:54px;

    border-radius:50%;

    background:#ffffff88;
}

#jump,
#skill{
    position:fixed;

    border:0;
    border-radius:50%;

    display:none;
}

    right:20px;
    bottom:28px;

    height:92px;

}

#skill{
    right:32px;
    bottom:135px;

    width:72px;
    height:72px;

    background:#8b5cf6;
}

#msg{
    position:fixed;

    top:72px;
    left:50%;

    transform:translateX(-50%);

    background:#101827e8;

    border-radius:13px;

/* =========================
   XP BAR
========================= */

}

<script>

/* =====================================================

===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W,H,D;

function resize(){

    D=Math.min(
        window.devicePixelRatio || 1,
        2
    );

    W=innerWidth;
    H=innerHeight;

    canvas.width=W*D;
    canvas.height=H*D;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(
        D,0,0,D,0,0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);

const SKILLS={

],

],

],

],

],

],

"แมวน้ำ":[
    "🌊 ดำน้ำเร็ว"
],

"พะยูน":[
    "💚 ฟื้นพลัง"
],

"หมีขั้วโลก":[

],

"เยติ":[

],

"หมาป่า":[

],

"หมูป่า":[

],

"ฮิปโป":[

],

"แรตมีเขา":[

],

"เสือ":[

]

};


/* =====================================================
   GAME STATE
===================================================== */

let selectedRace="wild";

let stage=0;

let xp=0;

let playing=false;

let playerX=0;

let playerZ=0;

let cameraX=0;

let cameraZ=0;

let moveX=0;

let moveZ=0;

let jumping=false;

let jumpY=0;

let jumpVelocity=0;


/* =====================================================
   อาหาร
===================================================== */

const foods=[];

for(
    let i=0;
    i<55;
    i++
){

    foods.push({

        x:(i*173)%1600-800,

        z:(i*239)%1200-600,

        type:i%3

    });

}


/* =====================================================
   เมนู
===================================================== */

const raceButtons=[];

const raceColors=[

    "#7146b7",

    "#087da5",

    "#a45b20",

    "#397da4",

    "#248343"

];

Object.keys(RACES)
.forEach(
    (key,index)=>{

        const race=RACES[key];

        const button=
            document.createElement(
                "button"
            );

        button.className="race";

        button.style.background=
            raceColors[index];

        button.innerHTML=
            "<span>"+
            race.icon+
            "</span>"+
            race.name;

        button.onclick=()=>{

            selectRace(key);

        };

        document
            .getElementById("races")
            .appendChild(button);

        raceButtons.push(
            [key,button]
        );

    }
);


/* =====================================================
   เลือกเผ่า
===================================================== */

function selectRace(key){

    selectedRace=key;

    stage=0;

    xp=0;

    raceButtons.forEach(
        item=>{

            item[1]
            .classList.toggle(
                "selected",
                item[0]===key
            );

        }
    );

    const animals=
        RACES[key].animals;

    document
        .getElementById("animals")
        .innerHTML=
        "<b>สายวิวัฒนาการ</b>"+
        "<div class='row'>"+
        animals.map(
            (animal,index)=>{

                let type;

                if(index===0){

                    type="เริ่มต้น";

                }else if(
                    index===
                    animals.length-1
                ){

                    type="🏆 2 สกิล";

                }else{

                    type="✨ 1 สกิล";

                }

                return `
                <div class="animal">
                    <b>${animal[0]}</b>
                    ${animal[1]}
                    <br>
                    <small>${type}</small>
                </div>
                `;

            }
        ).join("")+
        "</div>";

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    const race=
        RACES[selectedRace];

    const animal=
        race.animals[stage];

    const biome=
        BIOMES[race.biome];

    document
        .getElementById("animal")
        .textContent=
        animal[0]+" "+animal[1];

    document
        .getElementById("biome")
        .textContent=
        biome.name;

    document
        .getElementById("xp")
        .textContent=
        xp;

    const required=
        getRequiredXP();

    const percentage=
        Math.min(
            xp/required*100,
            100
        );

    document
        .getElementById("xpBar")
        .style.width=
        percentage+"%";

}


/* =====================================================
   XP
===================================================== */

function getRequiredXP(){

    return 20+
        stage*15;

}


function addXP(amount){

    xp+=amount;

    showMessage(
        "+"+amount+" XP"
    );

    while(

        stage<
        RACES[selectedRace]
        .animals.length-1

        &&

        xp>=getRequiredXP()

    ){

        xp-=getRequiredXP();

        stage++;

        const animal=
            RACES[selectedRace]
            .animals[stage];

        showMessage(
            "🧬 วิวัฒนาการเป็น "+
            animal[1]+"!"
        );

    }

    updateHUD();

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text){

    const message=
        document.getElementById(
            "msg"
        );

    message.textContent=text;

    message.style.display=
        "block";

    clearTimeout(
        showMessage.timer
    );

    showMessage.timer=
        setTimeout(
            ()=>{

                message.style.display=
                    "none";

            },
            1800
        );

}


/* =====================================================
   DRAW WORLD
===================================================== */

function drawWorld(){

    const biome=
        BIOMES[
            RACES[selectedRace]
            .biome
        ];

    /* SKY */

    ctx.fillStyle=
        biome.sky;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    /* GROUND */

    ctx.fillStyle=
        biome.ground;

    ctx.fillRect(
        0,
        H*0.47,
        W,
        H
    );


    /* DECORATIONS */

    for(
        let i=-1200;
        i<1300;
        i+=150
    ){

        const z=
            (i*7)%800-350;

        const sx=
            W/2+
            (i-cameraX)*1.08;

        const sy=
            H*0.49+
            (z-cameraZ)*0.28;

        ctx.fillStyle=
            biome.decoration;

        ctx.beginPath();

        ctx.arc(
            sx,
            sy-35,
            30,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillRect(
            sx-7,
            sy-8,
            14,
            42
        );

    }


    /* FOOD */

    foods.forEach(
        food=>{

            const sx=
                W/2+
                (food.x-cameraX)
                *1.08;

            const sy=
                H*0.49+
                (food.z-cameraZ)
                *0.28;

            if(
                sx>-40 &&
                sx<W+40 &&
                sy>-40 &&
                sy<H+40
            ){

                ctx.font=
                    "25px sans-serif";

                if(food.type===0){

                    ctx.fillText(
                        "🌱",
                        sx,
                        sy
                    );

                }else if(
                    food.type===1
                ){

                    ctx.fillText(
                        "🍎",
                        sx,
                        sy
                    );

                }else{

                    ctx.fillText(
                        "🥩",
                        sx,
                        sy
                    );

                }

            }

        }
    );


    /* PLAYER */

    const animal=
        RACES[selectedRace]
        .animals[stage];

    const sx=
        W/2+
        (playerX-cameraX)
        *1.08;

    const sy=
        H*0.49+
        (playerZ-cameraZ)
        *0.28-
        jumpY;


    /* SHADOW */

    ctx.fillStyle="#0005";

    ctx.beginPath();

    ctx.ellipse(
        sx,
        sy+30,
        30,
        8,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* MODEL */

    ctx.font=
        "64px sans-serif";

    ctx.textAlign=
        "center";

    ctx.fillText(
        animal[0],
        sx,
        sy+18
    );

    ctx.textAlign=
        "start";

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(){

    if(playing){

        playerX+=
            moveX*3;

        playerZ+=
            moveZ*3;


        cameraX+=
            (playerX-cameraX)
            *0.08;

        cameraZ+=
            (playerZ-cameraZ)
            *0.08;


        /* JUMP */

        if(jumping){

            jumpY+=
                jumpVelocity;

            jumpVelocity-=0.65;

            if(
                jumpY<=0
            ){

                jumpY=0;

                jumpVelocity=0;

                jumping=false;

            }

        }


        /* FOOD */

        foods.forEach(
            (food,index)=>{

                const distance=
                    Math.hypot(
                        food.x-playerX,
                        food.z-playerZ
                    );

                if(
                    distance<35
                ){

                    let amount;

                    if(
                        food.type===0
                    ){

                        amount=1;

                    }else if(
                        food.type===1
                    ){

                        amount=5;

                    }else{

                        amount=10;

                    }

                    addXP(amount);


                    /*
                     * Respawn food
                     */

                    food.x=
                        (index*311)
                        %1500-750;

                    food.z=
                        (index*179)
                        %1100-550;

                }

            }
        );

    }


    drawWorld();

    requestAnimationFrame(
        gameLoop
    );

}

gameLoop();


/* =====================================================
   START GAME
===================================================== */

document

.onclick=()=>{

   JUMP
===================================================== */

.getElementById("jump")

    if(!jumping){

.getElementById("skill")

    const skills=

    if(skills.length){

        showMessage(

/* =====================================================
   JOYSTICK
===================================================== */

const joystick=
    document.getElementById(
        "joy"
    );

const stick=
    document.getElementById(
        "stick"
    );

let dragging=false;


function moveJoystick(event){

    if(!dragging)
        return;


    const rect=
        joystick.getBoundingClientRect();


    let x=
        event.clientX-
        (
            rect.left+
            rect.width/2
        );


    let y=
        event.clientY-
        (
            rect.top+
            rect.height/2
        );


    const distance=
        Math.hypot(x,y);

    const max=
        45;


    if(
        distance>max
    ){

        x=
            x/distance*
            max;

        y=
            y/distance*
            max;

    }


    stick.style.transform=
        `translate(${x}px,${y}px)`;


    moveX=
        x/max;

    moveZ=
        y/max;

}


joystick
.addEventListener(
    "pointerdown",
    event=>{

        dragging=true;

        joystick.setPointerCapture(
            event.pointerId
        );

        moveJoystick(event);

    }
);


joystick
.addEventListener(
    "pointermove",
    moveJoystick
);


joystick
.addEventListener(
    "pointerup",
    ()=>{

        dragging=false;

        moveX=0;

        moveZ=0;

        stick.style.transform=
            "translate(0,0)";

    }
);


/* =====================================================
   KEYBOARD SUPPORT
   เผื่อเล่นบนคอม
===================================================== */

window.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="ArrowLeft" ||
            event.key==="a"
        ){

            moveX=-1;

        }

        if(
            event.key==="ArrowRight" ||
            event.key==="d"
        ){

            moveX=1;

        }

        if(
            event.key==="ArrowUp" ||
            event.key==="w"
        ){

            moveZ=-1;

        }

        if(
            event.key==="ArrowDown" ||
            event.key==="s"
        ){

            moveZ=1;

        }

        if(
            event.code==="Space"
        ){

            if(!jumping){

                jumping=true;

                jumpVelocity=10;

            }

        }

    }
);


window.addEventListener(
    "keyup",
    event=>{

        if(
            [
                "ArrowLeft",
                "ArrowRight",
                "a",
                "d"
            ].includes(
                event.key
            )
        ){

            moveX=0;

        }

        if(
            [
                "ArrowUp",
                "ArrowDown",
                "w",
                "s"
            ].includes(
                event.key
            )
        ){

            moveZ=0;

        }

    }
);


/* =====================================================
   INITIAL MENU
===================================================== */

selectRace(
    "wild"
);

</script>

</body>
</html>
