/* =========================================================
   CREATE LOW POLY ANIMAL
========================================================= */

function createAnimalModel(
animalName,
color=0x9b6b43,
scale=1
){

    const group=
    new THREE.Group();


    /*
       Body
    */

    const bodyGeo=
    new THREE.SphereGeometry(
        0.8,
        8,
        6
    );

    const bodyMat=
    new THREE.MeshStandardMaterial({
        color
    });

    const body=
    new THREE.Mesh(
        bodyGeo,
        bodyMat
    );

    body.scale.set(
        1.4,
        0.9,
        1.8
    );

    body.castShadow=true;

    group.add(body);


    /*
       Head
    */

    const headGeo=
    new THREE.SphereGeometry(
        0.55,
        8,
        6
    );

    const head=
    new THREE.Mesh(
        headGeo,
        bodyMat
    );

    head.position.z=-1.1;

    head.position.y=0.2;

    head.castShadow=true;

    group.add(head);


    /*
       Legs
    */

    for(
        let i=0;
        i<4;
        i++
    ){

        const leg=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.25,
                0.8,
                0.25
            ),
            bodyMat
        );

        leg.position.x=
            i%2===0
            ?-.45
            :.45;

        leg.position.z=
            i<2
            ?-.55
            :.55;

        leg.position.y=
            -.7;

        leg.castShadow=true;

        group.add(leg);

    }


    /*
       Tail
    */

    const tail=
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .12,
            .18,
            1,
            6
        ),
        bodyMat
    );

    tail.rotation.x=
    Math.PI/2;

    tail.position.z=
    1.25;

    tail.position.y=
    .1;

    group.add(tail);


    /*
       Eyes
    */

    const eyeMat=
    new THREE.MeshBasicMaterial({
        color:0x000000
    });


    [-.18,.18].forEach(
        x=>{

            const eye=
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .07,
                    6,
                    6
                ),
                eyeMat
            );

            eye.position.set(
                x,
                .35,
                -1.58
            );

            group.add(eye);

        }
    );


    /*
       special horns
    */

    if(
        animalName==="แรตมีเขา"
    ){

        const hornMat=
        new THREE.MeshStandardMaterial({
            color:0xd8d0bd
        });


        [-.25,.25].forEach(
            x=>{

                const horn=
                new THREE.Mesh(
                    new THREE.ConeGeometry(
                        .15,
                        .65,
                        6
                    ),
                    hornMat
                );

                horn.position.set(
                    x,
                    .7,
                    -1.2
                );

                horn.rotation.x=
                -.3;

                group.add(horn);

            }
        );

    }


    /*
       lion mane
    */

    if(
        animalName==="สิงโต"
    ){

        const mane=
        new THREE.Mesh(
            new THREE.TorusGeometry(
                .55,
                .2,
                8,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0x8a4a20
            })
        );

        mane.rotation.x=
        Math.PI/2;

        mane.position.set(
            0,
            .25,
            -1.05
        );

        group.add(mane);

    }


    /*
       wings
    */

    if(
        animalName==="ค้างคาวมีขา"
    ){

        const wingMat=
        new THREE.MeshStandardMaterial({
            color:0x3d294f,
            side:THREE.DoubleSide
        });


        [-1,1].forEach(
            side=>{

                const wing=
                new THREE.Mesh(
                    new THREE.PlaneGeometry(
                        1.5,
                        1
                    ),
                    wingMat
                );

                wing.position.x=
                    side*1;

                wing.position.y=
                    .4;

                wing.rotation.y=
                    side*.5;

                group.add(wing);

            }
        );

    }


    group.scale.setScalar(
        scale
    );


    return group;

}

/* =========================================================
   CREATE PLAYER
========================================================= */

function createPlayer(){

    if(player)
        scene.remove(player);

    const animal=
    RACES[selectedRace]
    .animals[stage][1];


    player=
    new THREE.Group();


    playerModel=
    createAnimalModel(
        animal,
        COLORS[animal] || 0xffffff,
        1.3
    );


    player.add(
        playerModel
    );


    player.position.set(
        0,
        1,
        0
    );


    scene.add(player);

}


/* =========================================================
   MAP
========================================================= */

const mapSize=200;

function createMap(){

    /*
       ground
    */

    const geo=
    new THREE.PlaneGeometry(
        mapSize,
        mapSize
    );

    const mat=
    new THREE.MeshStandardMaterial({
        color:
        BIOMES[currentBiome]
        .ground
    });


    const ground=
    new THREE.Mesh(
        geo,
        mat
    );

    ground.rotation.x=
    -Math.PI/2;

    ground.receiveShadow=true;

    world.add(ground);


    /*
       trees / decorations
    */

    for(
        let i=0;
        i<100;
        i++
    ){

        const tree=
        new THREE.Mesh(
            new THREE.ConeGeometry(
                1.5,
                5,
                6
            ),
            new THREE.MeshStandardMaterial({
                color:0x286b32
            })
        );


        tree.position.set(
            Math.random()*180-90,
            2.5,
            Math.random()*180-90
        );


        world.add(tree);

    }

}


/* =========================================================
   BIOME CHANGE
========================================================= */

function changeBiome(name){

    currentBiome=name;

    const biome=
    BIOMES[name];


    /*
       เปลี่ยนสีพื้น
    */

    world.children.forEach(
        object=>{

            if(
                object.geometry &&
                object.geometry.type===
                "PlaneGeometry"
            ){

                object.material.color
                .setHex(
                    biome.ground
                );

            }

        }
    );


    document
    .getElementById("biome")
    .textContent=
    biome.name;

}


/* =========================================================
   NPC ANIMALS
========================================================= */

const npcs=[];


/*
   สร้างสัตว์กระจายทั่วแมพ
*/

function spawnAnimals(){

    for(
        let i=0;
        i<45;
        i++
    ){

        const keys=
        Object.keys(RACES);

        const race=
        RACES[
            keys[
                Math.floor(
                    Math.random()*
                    keys.length
                )
            ]
        ];


        const animal=
        race.animals[
            Math.floor(
                Math.random()*
                race.animals.length
            )
        ];


        const model=
        createAnimalModel(
            animal[1],
            COLORS[animal[1]]
            ||0xffffff,
            .9
        );


        model.position.set(
            Math.random()*180-90,
            1,
            Math.random()*180-90
        );


        world.add(model);


        npcs.push({

            model:model,

            name:animal[1],

            hp:100,

            speed:
            .015+
            Math.random()*.02,

            attackCooldown:0,

            alive:true

        });

    }

}


/* =========================================================
   NPC MOVEMENT
========================================================= */

function updateNPCs(){

    npcs.forEach(
        npc=>{

            if(!npc.alive)
                return;


            /*
               เดินสุ่ม
            */

            npc.model.position.x+=
                Math.sin(
                    Date.now()*.0005+
                    npc.model.id
                )*
                npc.speed;


            npc.model.position.z+=
                Math.cos(
                    Date.now()*.0004+
                    npc.model.id
                )*
                npc.speed;


            /*
               จำกัดแมพ
            */

            npc.model.position.x=
            THREE.MathUtils.clamp(
                npc.model.position.x,
                -95,
                95
            );

            npc.model.position.z=
            THREE.MathUtils.clamp(
                npc.model.position.z,
                -95,
                95
            );


            /*
               ถ้าเข้าใกล้ผู้เล่น
               สามารถโจมตี
            */

            const distance=
            npc.model.position
            .distanceTo(
                player.position
            );


            if(
                distance<3
                &&
                npc.attackCooldown<=0
            ){

                playerHP-=5;

                npc.attackCooldown=60;

                updateHP();

                showMessage(
                    "⚔️ "+
                    npc.name+
                    " โจมตีคุณ!"
                );

            }


            if(
                npc.attackCooldown>0
            ){

                npc.attackCooldown--;

            }

        }
    );

}


/* =========================================================
   PLAYER ATTACK
========================================================= */

function attack(){

    if(!playing)
        return;


    let closest=null;

    let closestDistance=4;


    npcs.forEach(
        npc=>{

            if(!npc.alive)
                return;


            const distance=
            npc.model.position
            .distanceTo(
                player.position
            );


            if(
                distance<
                closestDistance
            ){

                closest=npc;

                closestDistance=
                    distance;

            }

        }
    );


    if(!closest){

        showMessage(
            "ไม่มีสัตว์อยู่ใกล้"
        );

        return;

    }


    /*
       ทุกสัตว์โจมตีได้
    */

    const damage=
        20+
        stage*10;


    closest.hp-=damage;


    showMessage(
        "⚔️ โจมตี "+
        closest.name+
        " -"+
        damage+
        " HP"
    );


    /*
       สัตว์ตาย
    */

    if(
        closest.hp<=0
    ){

        closest.alive=false;

        world.remove(
            closest.model
        );


        /*
           ได้ XP จากการชนะ
        */

        addXP(
            10
        );

        showMessage(
            "🏆 ชนะ "+
            closest.name+
            " +10 XP"
        );

    }

}


/* =========================================================
   SKILL ATTACK
========================================================= */

function useSkill(){

    if(stage===0){

        showMessage(
            "🔒 ต้องวิวัฒนาการก่อน"
        );

        return;

    }


    const animal=
    RACES[selectedRace]
    .animals[stage][1];


    const skills=
    SKILLS[animal] || [];


    if(!skills.length)
        return;


    /*
       เลือกสัตว์ใกล้สุด
    */

    let target=null;

    let distanceMin=9;


    npcs.forEach(
        npc=>{

            if(!npc.alive)
                return;


            const distance=
            npc.model.position
            .distanceTo(
                player.position
            );


            if(
                distance<
                distanceMin
            ){

                target=npc;

                distanceMin=
                    distance;

            }

        }
    );


    if(!target){

        showMessage(
            "ไม่มีเป้าหมายในระยะสกิล"
        );

        return;

    }


    const damage=
        35+
        stage*15;


    target.hp-=damage;


    showMessage(
        skills.join(" + ")+
        " ⚔️ -"+
        damage+
        " HP"
    );


    if(
        target.hp<=0
    ){

        target.alive=false;

        world.remove(
            target.model
        );

        addXP(15);

    }

}


/* =========================================================
   XP
========================================================= */

function requiredXP(){

    return 20+
    stage*20;

}


function addXP(amount){

    xp+=amount;


    while(

        stage<
        RACES[selectedRace]
        .animals.length-1

        &&

        xp>=requiredXP()

    ){

        xp-=requiredXP();

        stage++;

        level=
        stage+1;


        createPlayer();


        const animal=
        RACES[selectedRace]
        .animals[stage];


        showMessage(
            "🧬 วิวัฒนาการเป็น "+
            animal[1]+"!"
        );

    }


    updateHUD();

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    const animal=
    RACES[selectedRace]
    .animals[stage];


    document
    .getElementById("animalName")
    .textContent=
    animal[0]+" "+animal[1];


    document
    .getElementById("xp")
    .textContent=xp;


    document
    .getElementById("level")
    .textContent=
    level;


    updateHP();

}


function updateHP(){

    const percent=
    Math.max(
        0,
        playerHP
    );


    document
    .getElementById("hpInner")
    .style.width=
    percent+"%";


    if(
        playerHP<=0
    ){

        showMessage(
            "💀 คุณแพ้!"
        );

        playerHP=100;

    }

}


/* =========================================================
   MOVEMENT
========================================================= */

let moveX=0;

let moveZ=0;


/*
   ความเร็ว
*/

function getSpeed(){

    const animal=
    RACES[selectedRace]
    .animals[stage][1];


    const aquaticAnimals=[
        "ปลา",
        "ปลาดาบ",
        "ปลาปิรันยา",
        "ฉลาม",
        "ปลาหมึกยักษ์",
        "แมวน้ำ",
        "พะยูน"
    ];


    const isAquatic=
    aquaticAnimals
    .includes(animal);


    const isWater=
    currentBiome==="ocean";


    /*
       สัตว์น้ำในน้ำ
       เร็วปกติ
    */

    if(
        isAquatic &&
        isWater
    ){

        return .16;

    }


    /*
       สัตว์น้ำบนบก
       ช้าลง
    */

    if(
        isAquatic &&
        !isWater
    ){

        return .055;

    }


    /*
       สัตว์บกในน้ำ
       ช้าลง
    */

    if(
        !isAquatic &&
        isWater
    ){

        return .055;

    }


    /*
       สัตว์บกบนบก
    */

    return .16;

}


/* =========================================================
   UPDATE PLAYER
========================================================= */

function updatePlayer(){

    if(!playing)
        return;


    const speed=
    getSpeed();


    player.position.x+=
    moveX*speed;


    player.position.z+=
    moveZ*speed;


    /*
       Jump
    */

    player.position.y+=
    playerVelocityY;


    playerVelocityY-=.01;


    if(
        player.position.y<=1
    ){

        player.position.y=1;

        playerVelocityY=0;

        playerOnGround=true;

    }


    /*
       Camera
    */

    camera.position.x=
    player.position.x;

    camera.position.z=
    player.position.z+12;

    camera.position.y=
    player.position.y+7;


    camera.lookAt(
        player.position.x,
        player.position.y,
        player.position.z
    );


    /*
       เปลี่ยนไบโอมตามตำแหน่ง
    */

    const x=
    player.position.x;

    const z=
    player.position.z;


    let biome="forest";


    if(x>40){

        biome="ocean";

    }

    if(x<-40){

        biome="arctic";

    }

    if(
        z>40
    ){

        biome="swamp";

    }


    if(
        biome!==currentBiome
    ){

        changeBiome(
            biome
        );

    }

}


/* =========================================================
   JUMP
========================================================= */

function jump(){

    if(
        playerOnGround
    ){

        playerVelocityY=.22;

        playerOnGround=false;

    }

}


/* =========================================================
   MOBILE JOYSTICK
========================================================= */

const joystick=
document.getElementById(
    "joystick"
);

const stick=
document.getElementById(
    "stick"
);

let dragging=false;


function joystickMove(e){

    if(!dragging)
        return;


    const rect=
    joystick
    .getBoundingClientRect();


    let x=
    e.clientX-
    (
        rect.left+
        rect.width/2
    );


    let y=
    e.clientY-
    (
        rect.top+
        rect.height/2
    );


    const max=45;

    const distance=
    Math.hypot(x,y);


    if(
        distance>max
    ){

        x=
        x/distance*max;

        y=
        y/distance*max;

    }


    stick.style.transform=
    `translate(${x}px,${y}px)`;


    moveX=x/max;

    moveZ=y/max;

}


joystick
.addEventListener(
    "pointerdown",
    e=>{

        dragging=true;

        joystick
        .setPointerCapture(
            e.pointerId
        );

        joystickMove(e);

    }
);


joystick
.addEventListener(
    "pointermove",
    joystickMove
);


joystick
.addEventListener(
    "pointerup",
    ()=>{

        dragging=false;

        moveX=0;

        moveZ=0;

        stick.style.transform=
        "translate(0,0)";

    }
);


/* =========================================================
   BUTTONS
========================================================= */

document
.getElementById("jump")
.onclick=
jump;


document
.getElementById("attack")
.onclick=
attack;


document
.getElementById("skill")
.onclick=
useSkill;


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){

    const el=
    document.getElementById(
        "message"
    );


    el.textContent=text;

    el.style.display=
    "block";


    clearTimeout(
        showMessage.timer
    );


    showMessage.timer=
    setTimeout(
        ()=>{

            el.style.display=
            "none";

        },
        1800
    );

}


/* =========================================================
   SELECT RACE MENU
========================================================= */

const raceContainer=
document.getElementById(
    "races"
);


Object.keys(RACES)
.forEach(
    (key,index)=>{

        const race=
        RACES[key];


        const button=
        document.createElement(
            "button"
        );


        button.className=
        "race";


        button.style.background=[
            "#7146b7",
            "#087da5",
            "#a45b20",
            "#397da4",
            "#248343"
        ][index];


        button.innerHTML=
        `
        <span>${race.icon}</span>
        ${race.name}
        `;


        button.onclick=
        ()=>{

            selectedRace=key;

            stage=0;

            xp=0;

            level=1;


            document
            .querySelectorAll(
                ".race"
            )
            .forEach(
                b=>
                b.classList
                .remove(
                    "selected"
                )
            );


            button.classList
            .add(
                "selected"
            );


            showEvolution();

        };


        raceContainer
        .appendChild(
            button
        );

    }
);


/* =========================================================
   EVOLUTION MENU
========================================================= */

function showEvolution(){

    const race=
    RACES[selectedRace];


    const box=
    document
    .getElementById(
        "evolution"
    );


    box.innerHTML=
    "<b>สายวิวัฒนาการ</b>"+
    "<div class='evoRow'>"+
    race.animals
    .map(
        (a,i)=>{

            return `
            <div class="evo">

            <div class="evoIcon">
            ${a[0]}
            </div>

            ${a[1]}

            <br>

            <small>
            ${
                i===0
                ?"เริ่มต้น"
                :
                i===race.animals.length-1
                ?"🏆 2 สกิล"
                :"✨ 1 สกิล"
            }
            </small>

            </div>
            `;

        }
    )
    .join("")+
    "</div>";

}


/* =========================================================
   START GAME
========================================================= */

document
.getElementById("start")
.onclick=
()=>{

    playing=true;


    document
    .getElementById("menu")
    .style.display=
    "none";


    document
    .getElementById("hud")
    .style.display=
    "flex";


    document
    .getElementById("joystick")
    .style.display=
    "block";


    document
    .getElementById("jump")
    .style.display=
    "block";


    document
    .getElementById("attack")
    .style.display=
    "block";


    document
    .getElementById("skill")
    .style.display=
    "block";


    createMap();

    createPlayer();

    spawnAnimals();


    updateHUD();


    showMessage(
        "🌱 +1 XP | 🍎 +5 XP | 🥩 +10 XP"
    );

};


/* =========================================================
   KEYBOARD
========================================================= */

window
.addEventListener(
    "keydown",
    e=>{

        if(e.key==="w")
            moveZ=-1;

        if(e.key==="s")
            moveZ=1;

        if(e.key==="a")
            moveX=-1;

        if(e.key==="d")
            moveX=1;

        if(e.code==="Space")
            jump();

        if(e.key==="f")
            attack();

        if(e.key==="q")
            useSkill();

    }
);


window
.addEventListener(
    "keyup",
    e=>{

        if(
            e.key==="w" ||
            e.key==="s"
        )
            moveZ=0;

        if(
            e.key==="a" ||
            e.key==="d"
        )
            moveX=0;

    }
);


/* =========================================================
   GAME LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    updatePlayer();

    if(playing){

        updateNPCs();

    }


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================
   RESIZE
========================================================= */

window
.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
        innerWidth/
        innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =========================================================
   INITIAL MENU
========================================================= */

document
.querySelector(".race")
?.classList
.add("selected");


showEvolution();

</script>
